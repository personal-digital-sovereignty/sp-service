name: sp-service CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  release:
    types: [created]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  # ==========================================
  # Gate 0: Pipeline for Pipelines
  # ==========================================
  pipeline-security:
    name: "Gate 0: Actionlint & Zizmor"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check workflow YAML syntax (Actionlint)
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8

      - name: Analyze workflow security logic (Zizmor)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install zizmor
          zizmor .github/workflows || echo "Zizmor audit complete (non-blocking for MVP)."

  # ==========================================
  # Gate 1: SAST (Static Analysis)
  # ==========================================
  sast-semgrep:
    name: "Gate 1: Semgrep (SAST)"
    needs: pipeline-security
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Semgrep with Strict CI Enforcements
        run: semgrep scan --config auto --error --exclude-rule python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected

  # ==========================================
  # Gate 2: SCA (Dependencies)
  # ==========================================
  sca-trivy:
    name: "Gate 2: Trivy (SCA)"
    needs: sast-semgrep
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: 1
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # Gate 3: Rust Code Quality
  # ==========================================
  quality-rust:
    name: "Gate 3: Rust Clippy + Tests"
    needs: sast-semgrep
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: .
      - name: Install SQLite Runtime Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Cargo Clippy Audit
        run: cargo clippy -- -D warnings
      - name: Cargo Unit Tests
        run: cargo test

  # ==========================================
  # Gate 4: Python Workers Quality
  # ==========================================
  quality-python:
    name: "Gate 4: Ruff + Pytest"
    needs: pipeline-security
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install ruff pytest pandas tabulate
      - name: Ruff lint (critical errors only)
        run: ruff check python_workers/ --select E,F --ignore E501,E701
      - name: Pytest (AST Jail + Time-Series)
        run: pytest python_workers/tests/ -v --tb=short

  # ==========================================
  # Aggregate Gate
  # ==========================================
  foss-enterprise-devsecops:
    name: "FOSS Enterprise DevSecOps"
    needs: [pipeline-security, sast-semgrep, sca-trivy, quality-rust, quality-python]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - run: echo "All FOSS Enterprise DevSecOps Gates Passed!"

  # ==========================================
  # Builder Matrix
  # ==========================================
  build-core:
    needs: [foss-enterprise-devsecops]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: sp-service-linux-amd64
            binary_name: sovereign-daemon
            target_triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            artifact_name: sp-service-windows-amd64
            binary_name: sovereign-daemon.exe
            target_triple: x86_64-pc-windows-msvc
          - os: ubuntu-24.04-arm
            artifact_name: sp-service-linux-arm64
            binary_name: sovereign-daemon
            target_triple: aarch64-unknown-linux-gnu
          - os: macos-latest
            artifact_name: sp-service-macos-arm64
            binary_name: sovereign-daemon
            target_triple: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target_triple }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: .
          key: core-${{ matrix.os }}

      - name: Install SQLite Runtime Dependencies (Linux Only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config libssl-dev

      - name: Install OpenSSL (Windows Only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install openssl --no-progress -y
          echo "OPENSSL_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=C:\Program Files\OpenSSL-Win64\include" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:\Program Files\OpenSSL-Win64\lib\VC\x64\MD" >> $env:GITHUB_ENV

      - name: Compile sp-service (Rust)
        run: cargo build --release --target ${{ matrix.target_triple }}

      - name: Upload Core Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target_triple }}/release/${{ matrix.binary_name }}

      # --------------------------------------------------
      # Pacotes nativos (sem assinatura/notarização ainda —
      # ver aviso no release: instalação exige liberação manual
      # do Gatekeeper/dpkg local, não há repo APT/RPM próprio)
      # --------------------------------------------------
      - name: Install cargo-deb + cargo-binstall (Linux Only)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-deb,cargo-binstall

      - name: Install cargo-generate-rpm (Linux Only)
        if: runner.os == 'Linux'
        # --force: em runners ARM64 o cargo-binstall às vezes acha (errado) que
        # o crate já está instalado ("already installed, use --force to
        # override") e pula silenciosamente — sem o binário de verdade no PATH,
        # só descoberto no step seguinte ("no such command: generate-rpm").
        run: cargo binstall cargo-generate-rpm --no-confirm --locked --force

      - name: Build .deb Package (Linux Only)
        if: runner.os == 'Linux'
        run: cargo deb --no-build --target ${{ matrix.target_triple }}

      - name: Build .rpm Package (Linux Only)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # RPM não aceita '-' no campo version (só alphanumeric/./_/+/%/{}/~/^) —
          # "1.7.0-dev" vira "1.7.0~dev" (tilde ordena como pre-release, igual ao dpkg).
          RPM_VERSION="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2 | tr '-' '~')"
          cargo generate-rpm --target ${{ matrix.target_triple }} --set-metadata "version=\"$RPM_VERSION\""

      - name: Upload .deb Artifact (Linux Only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}-deb
          path: target/${{ matrix.target_triple }}/debian/*.deb

      - name: Upload .rpm Artifact (Linux Only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}-rpm
          path: target/${{ matrix.target_triple }}/generate-rpm/*.rpm

      - name: Build .pkg Installer (macOS Only)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          PKG_VERSION="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          mkdir -p pkgroot/usr/local/bin
          cp target/${{ matrix.target_triple }}/release/${{ matrix.binary_name }} pkgroot/usr/local/bin/
          pkgbuild \
            --root pkgroot \
            --identifier org.sovereignpair.sp-service \
            --version "$PKG_VERSION" \
            --install-location / \
            sp-service-macos-arm64.pkg

      - name: Upload .pkg Artifact (macOS Only)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}-pkg
          path: sp-service-macos-arm64.pkg

  # ==========================================
  # Release Distribution
  # ==========================================
  publish-nightly:
    needs: [build-core]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0

      - name: Update Nightly Tag
        uses: richardsimko/update-tag@aab2434e9a5040687874aa39d1c6377ec0cb0d94
        with:
          tag_name: nightly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename Artifacts for Release
        run: |
          mv sp-service-linux-amd64/sovereign-daemon sp-service-linux-amd64-binary
          mv sp-service-linux-arm64/sovereign-daemon sp-service-linux-arm64-binary
          mv sp-service-windows-amd64/sovereign-daemon.exe sp-service-windows-amd64-binary.exe
          mv sp-service-macos-arm64/sovereign-daemon sp-service-macos-arm64-binary

      - name: Generate Nightly Pre-Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          tag_name: nightly
          name: "sp-service Nightly (Unstable)"
          prerelease: true
          make_latest: false
          body: |
            Builds automatizados (Nightly) do sp-service.

            **Aviso:** Estes binarios sao compilados progressivamente (Continuous Deployment) no ultimo commit da branch `main` e nao refletem garantias de estabilidade.

            **Pacotes nativos (.deb/.rpm/.pkg) não são assinados/notarizados** (sem certificado Apple Developer ou chave de assinatura próprios ainda). No macOS, libere via clique-direito > Abrir; no Linux, instale com `dpkg -i`/`rpm -i` diretamente (não há repositório APT/YUM próprio).
          files: |
            sp-service-linux-amd64-binary
            sp-service-linux-arm64-binary
            sp-service-windows-amd64-binary.exe
            sp-service-macos-arm64-binary
            sp-service-linux-amd64-deb/*.deb
            sp-service-linux-arm64-deb/*.deb
            sp-service-linux-amd64-rpm/*.rpm
            sp-service-linux-arm64-rpm/*.rpm
            sp-service-macos-arm64-pkg/sp-service-macos-arm64.pkg

  publish-stable:
    needs: [build-core]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0

      - name: Rename Artifacts for Release
        run: |
          mv sp-service-linux-amd64/sovereign-daemon sp-service-linux-amd64-binary
          mv sp-service-linux-arm64/sovereign-daemon sp-service-linux-arm64-binary
          mv sp-service-windows-amd64/sovereign-daemon.exe sp-service-windows-amd64-binary.exe
          mv sp-service-macos-arm64/sovereign-daemon sp-service-macos-arm64-binary

      - name: Generate Stable Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          generate_release_notes: true
          append_body: true
          body: |
            **Pacotes nativos (.deb/.rpm/.pkg) não são assinados/notarizados** (sem certificado Apple Developer ou chave de assinatura próprios ainda). No macOS, libere via clique-direito > Abrir; no Linux, instale com `dpkg -i`/`rpm -i` diretamente (não há repositório APT/YUM próprio).
          files: |
            sp-service-linux-amd64-binary
            sp-service-linux-arm64-binary
            sp-service-windows-amd64-binary.exe
            sp-service-macos-arm64-binary
            sp-service-linux-amd64-deb/*.deb
            sp-service-linux-arm64-deb/*.deb
            sp-service-linux-amd64-rpm/*.rpm
            sp-service-linux-arm64-rpm/*.rpm
            sp-service-macos-arm64-pkg/sp-service-macos-arm64.pkg
