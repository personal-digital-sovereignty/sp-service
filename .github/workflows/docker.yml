name: Docker Build & Push

on:
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push to registry (or just build)'
        type: boolean
        default: true
      platforms:
        description: 'Comma-separated list of platforms to build for'
        type: string
        default: 'linux/amd64,linux/arm64'
      release_tag:
        description: 'Specific release tag to use (leave empty for auto-detection: stable → nightly)'
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Resolve Release Binaries
  # ==========================================
  resolve-release:
    name: "Resolve Release Binaries"
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_found: ${{ steps.resolve.outputs.release_found }}
    steps:
      - name: Resolve Release Tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 1. If user specified a tag, use it
          if [ -n "$INPUT_RELEASE_TAG" ]; then
            echo "Using user-specified tag: $INPUT_RELEASE_TAG"
            echo "release_tag=$INPUT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "release_found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Try latest stable release first
          STABLE_TAG=$(gh release list --repo "$GH_REPO" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ -n "$STABLE_TAG" ]; then
            echo "Found stable release: $STABLE_TAG"
            echo "release_tag=$STABLE_TAG" >> "$GITHUB_OUTPUT"
            echo "release_found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Fallback to nightly pre-release
          NIGHTLY_TAG=$(gh release list --repo "$GH_REPO" --limit 10 --json tagName,isPrerelease -q '.[] | select(.isPrerelease) | .tagName' 2>/dev/null | head -1 || echo "")
          if [ -n "$NIGHTLY_TAG" ]; then
            echo "No stable release found. Using nightly: $NIGHTLY_TAG"
            echo "release_tag=$NIGHTLY_TAG" >> "$GITHUB_OUTPUT"
            echo "release_found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 4. No release at all — graceful abort
          echo "⚠️ No releases found. Nothing to containerize."
          echo "release_tag=" >> "$GITHUB_OUTPUT"
          echo "release_found=false" >> "$GITHUB_OUTPUT"

  # ==========================================
  # Download Binaries from Release
  # ==========================================
  download-binaries:
    name: "Download Release Binaries"
    needs: resolve-release
    if: needs.resolve-release.outputs.release_found == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux AMD64 Binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Downloading sp-service-linux-amd64-binary from release $RELEASE_TAG..."
          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --pattern "sp-service-linux-amd64-binary" \
            --output sovereign-daemon-amd64
          chmod +x sovereign-daemon-amd64

      - name: Download Linux ARM64 Binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Downloading sp-service-linux-arm64-binary from release $RELEASE_TAG..."
          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --pattern "sp-service-linux-arm64-binary" \
            --output sovereign-daemon-arm64
          chmod +x sovereign-daemon-arm64

      - name: Upload AMD64 Binary as Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-binary-amd64
          path: sovereign-daemon-amd64
          retention-days: 1

      - name: Upload ARM64 Binary as Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-binary-arm64
          path: sovereign-daemon-arm64
          retention-days: 1

  # ==========================================
  # Build and Push Docker Image
  # ==========================================
  build-and-push:
    name: "Build and Push Docker Image"
    needs: [resolve-release, download-binaries]
    if: needs.resolve-release.outputs.release_found == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download AMD64 Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-binary-amd64
          path: binaries/amd64

      - name: Download ARM64 Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-binary-arm64
          path: binaries/arm64

      - name: Prepare Binaries
        run: |
          mv binaries/amd64/sovereign-daemon-amd64 binaries/amd64/sovereign-daemon
          mv binaries/arm64/sovereign-daemon-arm64 binaries/arm64/sovereign-daemon
          chmod +x binaries/amd64/sovereign-daemon binaries/arm64/sovereign-daemon
          echo "=== AMD64 ===" && ls -la binaries/amd64/
          echo "=== ARM64 ===" && ls -la binaries/arm64/

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Image Name
        id: prep
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          IMG="ghcr.io/$OWNER/sp-service"
          echo "image_name=$(echo "$IMG" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.prep.outputs.image_name }}
          tags: |
            type=raw,value=${{ needs.resolve-release.outputs.release_tag }}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: ${{ github.event.inputs.push_to_registry != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build local image for scan (amd64 only)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          tags: sp-service:scan
          platforms: linux/amd64
          cache-from: type=gha

      - name: Export image to tarball
        run: docker save sp-service:scan -o sp-service-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-image-scan
          path: sp-service-image.tar
          retention-days: 1

  # ==========================================
  # Post-Build Security Scan
  # ==========================================
  image-scan:
    name: "Post-Build Image Scan"
    needs: [resolve-release, build-and-push]
    runs-on: ubuntu-latest
    if: needs.resolve-release.outputs.release_found == 'true'
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image-scan

      - name: Run Trivy vulnerability scanner on local image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          input: sp-service-image.tar
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Print scan summary
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          echo "============================================"
          echo "  Docker Image Security Scan Summary"
          echo "============================================"
          echo ""
          echo "Release: $RELEASE_TAG"
          echo "Scan Status: Complete"
          echo ""
          echo "Check the Security tab for detailed results."

  # ==========================================
  # Graceful Abort (No Release Found)
  # ==========================================
  no-release:
    name: "No Release Available"
    needs: resolve-release
    if: needs.resolve-release.outputs.release_found != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Abort Gracefully
        run: |
          echo "============================================"
          echo "  ⚠️  No Release Available"
          echo "============================================"
          echo ""
          echo "No stable or nightly release was found."
          echo "Run the CI pipeline first to generate binaries"
          echo "and publish a nightly or stable release."
          echo ""
          echo "Pipeline exiting cleanly (no error)."
